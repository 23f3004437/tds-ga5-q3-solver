services:
  - type: web
    name: q3-guardrail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: Q3_SECRET
        value: /home/agent/service-account.json
      - key: Q3_WRITE_ROOT
        value: /home/agent/workspace/build
      - key: Q3_ALLOWED_HOSTS
        value: api.github.com,huggingface.co
